<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login • AssetbyNu</title><link rel="stylesheet" href="style.css"></head><body class="loginpage"><div class="loginbox"><h1>Asset<span style="color:#0a91b7">byNu</span></h1><p class="muted">Sistem Manajemen Aset Gardu Distribusi</p><form id="login"><div class="field"><label>Username</label><select id="username" required><option value="admin">admin</option><option value="inspeksi">inspeksi</option></select></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" id="submit">Masuk</button><p id="err" style="color:#c33"></p></form></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const client=supabase.createClient(ASSET_CONFIG.url,ASSET_CONFIG.key);document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const b=document.querySelector('#submit');b.disabled=true;b.textContent='Memeriksa...';let username=document.querySelector('#username').value;let {error}=await client.auth.signInWithPassword({email:ASSET_CONFIG.emails[username],password:document.querySelector('#password').value});if(error){document.querySelector('#err').textContent='Login gagal: '+error.message;b.disabled=false;b.textContent='Masuk';return}location.href=username==='admin'?'dashboard.html':'pengukuran.html'};client.auth.getUser().then(({data:{user}})=>{if(user)location.href=user.email===ASSET_CONFIG.emails.admin?'dashboard.html':'pengukuran.html'});</script></body></html>
